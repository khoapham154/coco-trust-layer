<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coco · Trust Layer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v=4" />
  <link rel="icon" type="image/svg+xml" href="/static/assets/coco-logo.svg" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Primary navigation">
      <a class="brand" href="#/live">
        <img class="brand-logo" src="/static/assets/coco-logo.svg" alt="Coco" />
      </a>

      <div class="nav-section">
        <div class="nav-section-label">Operate</div>
        <a class="nav-item" data-route="live" href="#/live">
          <span class="nav-glyph" data-glyph="activity"></span>
          <span>Live</span>
        </a>
        <a class="nav-item" data-route="escalations" href="#/escalations">
          <span class="nav-glyph" data-glyph="bell"></span>
          <span>Escalations</span>
          <span class="nav-badge" id="badge-escalations" data-empty="true">0</span>
        </a>
      </div>

      <div class="nav-section">
        <div class="nav-section-label">Govern</div>
        <a class="nav-item" data-route="packs" href="#/packs">
          <span class="nav-glyph" data-glyph="file"></span>
          <span>Action Packs</span>
        </a>
        <a class="nav-item" data-route="audit" href="#/audit">
          <span class="nav-glyph" data-glyph="layers"></span>
          <span>Audit Ledger</span>
        </a>
      </div>

      <div class="nav-section">
        <div class="nav-section-label">Connect</div>
        <a class="nav-item" data-route="integrations" href="#/integrations">
          <span class="nav-glyph" data-glyph="plug"></span>
          <span>Integrations</span>
        </a>
        <a class="nav-item" data-route="settings" href="#/settings">
          <span class="nav-glyph" data-glyph="cog"></span>
          <span>Settings</span>
        </a>
      </div>

      <div class="nav-section">
        <div class="nav-section-label">Demo</div>
        <a class="nav-item" data-route="banking" href="#/banking">
          <span class="nav-glyph" data-glyph="bank"></span>
          <span>Agent Banking</span>
        </a>
      </div>

      <div class="sidebar-foot">
        <div>Gateway v0.2</div>
        <div id="foot-clock">—</div>
      </div>
    </aside>

    <header class="topbar">
      <div class="topbar-left">
        <button class="workspace" id="workspace-btn" type="button" aria-label="Switch workspace">
          <span>Twenty CRM</span>
          <span class="workspace-chev">▾</span>
        </button>
      </div>
      <div class="topbar-right">
        <button class="search-box" id="palette-open" type="button" aria-label="Open command palette">
          <span class="nav-glyph" data-glyph="search"></span>
          <span>Search packs, scenarios, audit…</span>
          <span class="kbd">⌘K</span>
        </button>
        <span class="health-pill" id="health-pill" title="Gateway health">
          <span class="health-dot" data-status="unknown"></span>
          <span id="health-label">Checking…</span>
        </span>
      </div>
    </header>

    <main class="main" id="view-root" aria-live="polite"></main>
  </div>

  <!-- Drawer (verdict / pack detail) -->
  <div class="drawer-scrim" id="drawer-scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div class="drawer-title">
        <span class="verdict verdict-lg" data-v="—" id="drawer-verdict">—</span>
        <h3 id="drawer-title">Select a verdict</h3>
      </div>
      <button class="drawer-close" id="drawer-close" aria-label="Close">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
    <div class="drawer-foot" id="drawer-foot"></div>
  </aside>

  <!-- Command palette -->
  <div class="palette-scrim" id="palette-scrim"></div>
  <div class="palette" id="palette" role="dialog" aria-hidden="true">
    <input class="palette-input" id="palette-input" placeholder="Jump to a view, pack, or scenario…" autocomplete="off" />
    <ul class="palette-list" id="palette-list" role="listbox"></ul>
  </div>

  <!-- Toast stack -->
  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

  <script src="/static/app.js?v=4" defer></script>
</body>
</html>
