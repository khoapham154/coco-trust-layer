id: banking.add_beneficiary
action: add_beneficiary
description: >
  Governs an agent adding a new payee to an account, the step that comes
  before any money can be sent to it. A new beneficiary is the usual first
  move in a payment-fraud sequence, so the payee's account details must
  verify against the record held at the receiving bank, and a first-time
  payee in a monitored region is held for a compliance officer. The
  verification result lives in the counterparty record, not in the request
  the agent submits, so a caller that trusts the request alone never sees
  it.

pre_conditions:
  - id: account_active
    type: equals
    path: account.status
    value: active
    on_fail: BLOCK
    reason: Source account is not active

constraints:
  - id: account_verified
    rule: counterparty.account_verified == true
    on_fail: BLOCK
    reason: Payee account details failed verification with the receiving bank
  - id: known_or_low_risk
    rule: counterparty.first_time_in_monitored_region == false
    on_fail: ESCALATE
    reason: First-time payee in a monitored jurisdiction needs compliance approval
