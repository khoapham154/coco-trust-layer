id: banking.wire_transfer
action: initiate_transfer
description: >
  Payment governance for agent-initiated wire transfers. The payee must be
  an approved beneficiary, the destination account must match the account
  on file for that payee, and a transfer above the account's auto-release
  limit is held for human approval. The beneficiary register and the
  auto-release limit live in account attributes, not in the
  transaction-request response, so a caller that reads only the OBP
  transaction API never sees them.

pre_conditions:
  - id: account_active
    type: equals
    path: account.status
    value: active
    on_fail: BLOCK
    reason: Source account is not active

constraints:
  - id: payee_approved
    rule: transfer.payee_approved == true
    on_fail: BLOCK
    reason: Payee is not an approved beneficiary on this account
  - id: amount_within_auto_limit
    rule: transfer.amount <= account.auto_release_limit
    on_fail: ESCALATE
    reason: Transfer exceeds the account's auto-release limit and needs human approval
  - id: payee_account_match
    rule: transfer.destination_account == transfer.payee_account_on_file
    on_fail: BLOCK
    reason: Destination account does not match the account on file for this payee
