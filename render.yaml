# Render Blueprint: the Coco Trust Layer gateway (dashboard + Agent Banking
# and Securities Lending demos) as one Docker web service on the free plan.
# Same-origin, so it serves the dashboard, the demo APIs, and mock OBP from
# one host.
#
# Setup: Render dashboard -> New -> Blueprint -> pick this repo + the
# main branch. Free plan sleeps after 15 min idle (first hit after idle is
# slow) and the audit DB resets on restart; both are fine for a demo. The
# entrypoint re-seeds the securities-lending ledger on each cold boot.
services:
  - type: web
    name: coco-trust-layer
    runtime: docker
    repo: https://github.com/khoapham154/coco-trust-layer
    branch: main
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    # render_boot.sh binds uvicorn to Render's injected $PORT, then seeds the
    # securities-lending ledger once the gateway is healthy. The bank provider
    # reads $PORT for its localhost self-call (see backend/providers/bank.py),
    # and COCO_PACK_DIR stays unset so the Twenty, banking and
    # securities-lending pack directories all load (14 packs).
    dockerCommand: bash render_boot.sh
    envVars:
      - key: COCO_DB_PATH
        value: /tmp/audit.db
      - key: PYTHONUNBUFFERED
        value: "1"
