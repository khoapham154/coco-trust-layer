<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CoCo Trust Layer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup">
    <header class="popup-header">
      <div class="brand-mark">CoCo</div>
      <div>
        <div class="brand-title">Trust Layer</div>
        <div class="brand-sub" id="popup-version">v0.1.0</div>
      </div>
    </header>

    <div class="popup-status">
      <span class="status-pill" id="status-pill">
        <span class="status-dot"></span>
        <span id="status-text">Checking…</span>
      </span>
      <span class="packs-loaded" id="packs-loaded"></span>
    </div>

    <section class="field">
      <label for="gateway-url">Gateway URL</label>
      <input id="gateway-url" type="url" placeholder="http://localhost:8080" />
    </section>

    <section class="field">
      <label for="app-id">App ID</label>
      <input id="app-id" type="text" placeholder="twenty" />
    </section>

    <section class="toggle-row">
      <label class="toggle">
        <input id="enabled" type="checkbox" />
        <span>Enabled on Twenty tabs</span>
      </label>
    </section>

    <footer class="popup-actions">
      <button id="save" class="btn btn-primary">Save</button>
      <button id="refresh" class="btn btn-ghost">Recheck</button>
      <a id="open-dashboard" class="btn btn-ghost" href="#" target="_blank">Dashboard</a>
    </footer>

    <div class="popup-footnote" id="popup-footnote">
      The SDK is injected fresh on every tab load from the gateway above.
    </div>

    <script src="popup.js"></script>
  </body>
</html>
